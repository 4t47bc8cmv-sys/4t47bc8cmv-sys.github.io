<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Keyverse is currently undergoing brief scheduled maintenance. Back online shortly." />
  <title>Keyverse — Maintenance</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%2313f2b0%22/><text x=%2212%22 y=%2217%22 font-size=%2214%22 text-anchor=%22middle%22 fill=%22%230b0e11%22 font-family=%22monospace%22 font-weight=%22700%22>K</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e11;
      --panel: #12181d;
      --text: #edf3f7;
      --muted: #9aa5af;
      --accent: #13f2b0;
      --accent-hover: #4ff7c4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(19, 242, 176, 0.12), transparent 35%),
        #0b0e11;
      padding: 1rem;
    }

    .maintenance {
      width: min(92vw, 760px);
      padding: 48px 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(18, 24, 29, 0.9);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(19, 242, 176, 0.12);
      border: 1px solid rgba(19, 242, 176, 0.35);
      color: var(--accent);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    p {
      margin: 18px auto 0;
      max-width: 560px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.125rem);
      line-height: 1.7;
    }

    .actions {
      margin-top: 32px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 8px;
      background: var(--accent);
      color: #0b0e11;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 180ms ease, transform 180ms ease;
    }

    .btn-home:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main class="maintenance" aria-live="polite">
    <div class="badge">Keyverse System Status</div>
    <h1>Keyverse is down for quick maintenance</h1>
    <p>We are making scheduled improvements across the Keyverse series and account systems. All games and progress will be back online shortly!</p>
    <div class="actions">
      <a href="index.html" class="btn-home">← Return to Homepage</a>
    </div>
  </main>
</body>
</html>
