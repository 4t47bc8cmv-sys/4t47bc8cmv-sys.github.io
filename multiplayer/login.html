<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In · Keyverse Split-Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./shared.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
<div class="kv-shell">
  <a href="/" class="kv-brand">
    <svg viewBox="0 0 32 32" fill="none" aria-label="Keyverse logo">
      <rect x="2" y="8" width="28" height="18" rx="4" stroke="currentColor" stroke-width="2"/>
      <rect x="7" y="13" width="4" height="4" rx="1" fill="currentColor"/>
      <rect x="14" y="13" width="4" height="4" rx="1" fill="currentColor"/>
      <rect x="21" y="13" width="4" height="4" rx="1" fill="currentColor"/>
      <rect x="7" y="19" width="18" height="3" rx="1.5" fill="currentColor"/>
    </svg>
    <span>KEYVERSE</span>
  </a>

  <div class="kv-card">
    <h1 class="kv-title">Sign in to your account</h1>
    <p class="kv-subtitle">Enter the email you used to unlock split-screen. We'll send you a one-time sign-in link — no password needed.</p>

    <div id="status" class="kv-status"></div>

    <form id="loginForm">
      <label class="kv-label" for="email">Email address</label>
      <input class="kv-input" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      <button class="kv-btn kv-btn-primary" type="submit" id="submitBtn">Send sign-in link</button>
    </form>
  </div>

  <p class="kv-footer-note">
    Don't have an account yet? Split-screen is a one-time $7.77 unlock.<br />
    <a class="kv-link" href="./join.html">Joining with an invite code instead? Click here →</a>
  </p>
</div>

<script src="./shared.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  function showStatus(kind, msg) {
    statusEl.className = `kv-status show ${kind}`;
    statusEl.textContent = msg;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="kv-loader"></span> Sending…';
    showStatus('info', 'Sending your sign-in link…');

    try {
      const redirectTo = new URL('./account.html', window.location.href).toString();
      const { error } = await getSupabaseClient().auth.signInWithOtp({
        email,
        options: { emailRedirectTo: redirectTo },
      });
      if (error) throw error;
      showStatus('success', `Check ${email} for a sign-in link. It may take a minute to arrive — don't forget to check spam.`);
      submitBtn.innerHTML = 'Link sent ✓';
    } catch (err) {
      showStatus('error', err.message || 'Something went wrong sending the link. Please try again.');
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Send sign-in link';
    }
  });
</script>
</body>
</html>
