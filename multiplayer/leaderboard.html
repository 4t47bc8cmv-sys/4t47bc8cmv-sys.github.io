<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leaderboard · Keyverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./shared.css" />
</head>
<body>
<div class="kv-shell kv-wide">
  <a href="/" class="kv-brand">
    <svg viewBox="0 0 32 32" fill="none" aria-label="Keyverse logo">
      <rect x="2" y="8" width="28" height="18" rx="4" stroke="currentColor" stroke-width="2"/>
      <rect x="7" y="13" width="4" height="4" rx="1" fill="currentColor"/>
      <rect x="14" y="13" width="4" height="4" rx="1" fill="currentColor"/>
      <rect x="21" y="13" width="4" height="4" rx="1" fill="currentColor"/>
      <rect x="7" y="19" width="18" height="3" rx="1.5" fill="currentColor"/>
    </svg>
    <span>KEYVERSE</span>
  </a>

  <div class="kv-card">
    <h1 class="kv-title">Leaderboard</h1>
    <p class="kv-subtitle">Fastest completion time wins. Pick a game and a board to see who's on top.</p>

    <div class="kv-row" style="margin-bottom: 4px;">
      <div style="flex:1;">
        <label class="kv-label" for="gameSelect">Game</label>
        <select class="kv-input" id="gameSelect"></select>
      </div>
      <div style="flex:1;">
        <label class="kv-label" for="boardSelect">Board</label>
        <select class="kv-input" id="boardSelect"></select>
      </div>
    </div>
  </div>

  <div class="kv-card" id="resultsCard">
    <div id="loadingRow" class="kv-empty"><span class="kv-loader"></span> Loading rankings…</div>
    <table class="kv-table" id="lbTable" style="display:none;">
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th>Time</th>
          <th>Attempts</th>
          <th>Correct</th>
          <th>Incorrect</th>
        </tr>
      </thead>
      <tbody id="lbBody"></tbody>
    </table>
    <div id="emptyRow" class="kv-empty" style="display:none;">No scores recorded for this board yet — be the first!</div>
    <div id="errorRow" class="kv-empty" style="display:none;"></div>
  </div>

  <p class="kv-footer-note">
    <a class="kv-link" href="./join.html">Join with an invite code →</a>
  </p>
</div>

<script src="./shared.js"></script>
<script>
  const gameSelect = document.getElementById('gameSelect');
  const boardSelect = document.getElementById('boardSelect');

  GAMES.forEach((g) => {
    const opt = document.createElement('option');
    opt.value = g.slug;
    opt.textContent = g.name;
    gameSelect.appendChild(opt);
  });

  function populateBoards() {
    const game = GAMES.find((g) => g.slug === gameSelect.value) || GAMES[0];
    boardSelect.innerHTML = '';
    for (let i = 1; i <= game.boards; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `Board ${i}`;
      boardSelect.appendChild(opt);
    }
  }

  function formatTime(seconds) {
    const s = Number(seconds);
    const mins = Math.floor(s / 60);
    const secs = (s % 60).toFixed(2);
    return mins > 0 ? `${mins}:${secs.padStart(5, '0')}` : `${secs}s`;
  }

  async function loadLeaderboard() {
    const loadingRow = document.getElementById('loadingRow');
    const table = document.getElementById('lbTable');
    const emptyRow = document.getElementById('emptyRow');
    const errorRow = document.getElementById('errorRow');
    const tbody = document.getElementById('lbBody');

    loadingRow.style.display = 'flex';
    table.style.display = 'none';
    emptyRow.style.display = 'none';
    errorRow.style.display = 'none';
    tbody.innerHTML = '';

    try {
      const rows = await apiFetch(
        `/api/leaderboard?game_slug=${encodeURIComponent(gameSelect.value)}&board_id=${encodeURIComponent(boardSelect.value)}`
      );
      loadingRow.style.display = 'none';

      if (!rows || rows.length === 0) {
        emptyRow.style.display = 'block';
        return;
      }

      rows.forEach((row, i) => {
        const rank = i + 1;
        const tr = document.createElement('tr');
        const rankClass = rank <= 3 ? `kv-rank kv-rank-${rank}` : 'kv-rank';
        tr.innerHTML = `
          <td class="${rankClass}">${rank}</td>
          <td>${(row.players && row.players.nickname) || 'Unknown'}</td>
          <td>${formatTime(row.time_seconds)}</td>
          <td>${row.attempts}</td>
          <td>${row.correct_count}</td>
          <td>${row.incorrect_count}</td>
        `;
        tbody.appendChild(tr);
      });
      table.style.display = 'table';
    } catch (err) {
      loadingRow.style.display = 'none';
      errorRow.style.display = 'block';
      errorRow.textContent = err.message || 'Could not load the leaderboard right now.';
    }
  }

  gameSelect.addEventListener('change', () => { populateBoards(); loadLeaderboard(); });
  boardSelect.addEventListener('change', loadLeaderboard);

  populateBoards();
  loadLeaderboard();
</script>
</body>
</html>
